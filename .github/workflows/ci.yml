name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Fast feedback: anything that does not need a database.
  static:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Everything downstream imports the shared contracts, so build them first.
      - name: Build shared package
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Shared unit tests
        run: npm run test:shared

      - name: Web unit tests
        run: npm run test:web

  # Integration tests run against a real Postgres — the ORM is never mocked.
  api:
    name: API integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowsync
          POSTGRES_PASSWORD: flowsync
          POSTGRES_DB: flowsync
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://flowsync:flowsync@localhost:5432/flowsync?schema=public
      DATABASE_URL_TEST: postgresql://flowsync:flowsync@localhost:5432/flowsync_test?schema=public
      JWT_SECRET: ci-secret-that-is-long-enough-for-production-checks
      REDIS_ENABLED: 'false'
      WEB_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build:shared
      - run: npm run db:generate

      - name: Prepare the test database
        run: npm run db:test:setup --workspace @flowsync/api

      - name: Run integration tests
        run: npm run test:api

  build:
    name: Production builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run db:generate

      - name: Build every workspace
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    needs: [static]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowsync
          POSTGRES_PASSWORD: flowsync
          POSTGRES_DB: flowsync
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://flowsync:flowsync@localhost:5432/flowsync?schema=public
      JWT_SECRET: ci-secret-that-is-long-enough-for-production-checks
      REDIS_ENABLED: 'true'
      REDIS_URL: redis://localhost:6379
      API_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      WEB_PORT: '3000'
      API_PORT: '4000'
      COOKIE_SAMESITE: lax
      COOKIE_SECURE: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run build

      - name: Apply migrations and seed the demo workspace
        run: |
          npm run db:deploy --workspace @flowsync/api
          npm run db:seed --workspace @flowsync/api

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Fails the build on high or critical advisories in runtime dependencies.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
